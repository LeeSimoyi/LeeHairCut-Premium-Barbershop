<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2b2b"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>
  </defs>
  <!-- Scissors blades -->
  <g transform="translate(32,32)">
    <!-- Blade 1 -->
    <line x1="-14" y1="-14" x2="14" y2="14" stroke="url(#rg)" stroke-width="4" stroke-linecap="round"/>
    <!-- Blade 2 -->
    <line x1="14" y1="-14" x2="-14" y2="14" stroke="url(#rg)" stroke-width="4" stroke-linecap="round"/>
    <!-- Center pivot -->
    <circle cx="0" cy="0" r="3.5" fill="url(#rg)"/>
    <!-- Handle circles -->
    <circle cx="-16" cy="16" r="5" fill="none" stroke="url(#rg)" stroke-width="2.5"/>
    <circle cx="16" cy="16" r="5" fill="none" stroke="url(#rg)" stroke-width="2.5"/>
  </g>
  <!-- L letter -->
  <text x="10" y="20" font-family="Arial Black,sans-serif" font-weight="900" font-size="14" fill="#ffffff" opacity="0.9">L</text>
</svg>
