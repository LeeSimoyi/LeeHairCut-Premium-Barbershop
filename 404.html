  <style>
    .error-page{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px var(--gutter,40px);background:var(--dark);position:relative;overflow:hidden}
    .error-page::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(179,0,0,0.12),transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%)}
    .error-content{position:relative;z-index:1;max-width:600px}
    .error-number{font-family:'Poppins',sans-serif;font-size:clamp(6rem,15vw,11rem);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--red-bright),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
    .error-content h1{font-size:clamp(1.5rem,3vw,2rem);font-weight:800;margin-bottom:14px}
    .error-content p{color:var(--gray);font-size:0.97rem;line-height:1.8;margin-bottom:34px}
    .error-links{display:flex;justify-content:center;flex-wrap:wrap;gap:13px}
    .scissors-anim{font-size:2.8rem;color:rgba(255,255,255,0.08);margin-bottom:20px;animation:spin 5s linear infinite}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  </style>
</head>
